spring.application.name=devioz-recluta
server.port=8080

# Conexión MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/devioz_recluta?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicialización de datos (data.sql después de que JPA cree tablas)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.encoding=UTF-8

# Swagger UI en /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
